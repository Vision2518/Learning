<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .uber-button{
           background-color:black;
           color:white;
           border:none;
           height:35px;
           width:120px;
           cursor:pointer;
            transition:opacity 0.15s;
        }
        .uber-button:hover{
            opacity:0.76
        }
        .amazon-button{
            background-color:rgb(255,216,20);
            color:black;
            border:none;
            height:35px;
            width:180px;
            border-radius:17px;
            cursor:pointer;
        }
        .amazon-button:hover{
            background-color: rgba(227, 165, 20, 0.8);
        }
        .github-button{
            background-color:rgb(46,164,79);
            color:white;
            height:28px;
            width:80px;
            border:none;
            border-radius:5px;
            cursor:pointer;
             
        }
        .github-button:hover{
            box-shadow:0px 5px  8px 5px rgba(0,0,0,0.15)
        }
        .get-started{
            margin-top:20px;
            background-color: rgb(121,82,179);
            color:white;
            border:none;
            height:35px;
            width:140px;
            border-radius:5px;
            margin-right:10px;
            cursor:pointer;
        }
        .download{
            background-color:white;
         color:rgb(108,117,125);
         height:35px;
         border-width:1px;
         border-style:solid;
         border-color:rgb(108,117,125);
         width:100px;
         border-radius:5px;
         cursor:pointer;
        }
        .apply-on{
            margin-top:12px;
            background-color:rgb(10,102,179);
            border:none;
            height:40px;
            width:240px;
            color:white;
            border-radius:6px;
            font-weight:bold;
            cursor:pointer;
        }
        .save{
             color:rgb(27, 115, 192);
         height:35px;
         font-weight:bold;
         border-width:1px;
         border-style:solid;
         border-color:rgb(27, 115, 192);
         width:100px;
         border-radius:10px;
         cursor:pointer;
        }
    </style>
</head>
<body>
    <button class="uber-button">Request now
    </button>
    <button class="amazon-button">
        Add to Cart
    </button>
    <button class="github-button">
        Sign up
    </button>
    <div>
         <button class="get-started">
        Get Started
    </button>
    <button class="download">
        Download
    </button>
    </div>
   <div><button class="apply-on">
         Apply on company website
    </button>
    <button class="save">Save</button></div>
    
</body>
</body>
</html>

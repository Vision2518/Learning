
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      a {
    color: rgb(0, 113, 133);
    font-size:20px; 
}
a:hover{
      color: rgb(199, 81, 31);
}
        .shoes{
            font-size:30px;
            font-weight:bold;
        }
        .price{
            color:rgb(0,118,0);

            font-size:18px;
        }
        .add-to-cart-button{
            background-color:rgb(255,216,20);
            border:none;
            height:30px;
            width:113px;
            border-radius:15px;
            margin-right:8px;
            cursor:pointer;
        }
        .buy-now-button{
            background-color:rgb(255,164,28);
            border:none;
            height:30px;
            width:113px;
            border-radius:15px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <a href="www.amazon.com" target="blank">
        Back to Amazon
    </a>
    <p class="shoes">
        Nike Black Running Shoes
    </p>
    <p class="price">
        $39 - in stock
    </p>
    <p>
        Free delivery Tommorw
    </p>
    <button class="add-to-cart-button">
        Add to Cart
    </button>
    <button class="buy-now-button">
        Buy now
    </button>
</body>
</html>

<head>

    <title>Register</title>
</head>
<body>
    <h1>User Registration</h1>
    <form id="test">
        <label for="flname">UserName:</label><br>
     <input type="text" id="flname" name="full-name" placeholder="Enter your full name"><br>
     <label for="email" >Email:</label><br>
     <input type="email"id="email" name="email" placeholder="Enter your Email"><br><br>
     <button type="submit" id="button">Register Now</button>
    </form>
    <p id="empty"></p>
    <script>
       const form= document.getElementById("test");
       const fname= document.getElementById("flname");
       const email= document.getElementById("email");
        const message=document.getElementById("empty");
       form.addEventListener("submit",async function (event){
         event.preventDefault();
            const user={
            name:fname.value,
            email:email.value
        }
         const response= await fetch("https://jsonplaceholder.typicode.com/users",{
            method:"POST",
            headers:{"content-type":"application/json"},body:JSON.stringify(user)})
        }
       )
  </script>
</body>
